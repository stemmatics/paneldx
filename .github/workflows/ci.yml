name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run this entire file rather than maintaining a second,
  # always-slightly-different copy of the same checks.
  workflow_call:

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

# Superseded pushes to the same branch stop wasting runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" "ai-slop-detector==3.8.9"
      - run: ruff check .
      - run: ruff format --check .
      # A small deterministic check on the god_function thresholds in
      # .slopconfig.yaml: a new over-complex function fails the build while the
      # reviewed ones do not. Kept alongside the detector, not instead of it.
      - run: python -m scripts.check_complexity
      # README links must survive leaving GitHub: PyPI renders the README
      # standalone and a released description cannot be edited afterwards.
      - run: python -m scripts.check_readme_links
      - run: python -m scripts.check_release_metadata
      - name: AI code-quality gate
        run: >
          ai-slop-detector
          --project .
          --no-history
          --config .slopconfig.yaml
          --fail-threshold 2.5
          --no-color

  # Unit and regression tests: the library's own behaviour, on synthetic data
  # with known answers, across the supported Python range. No network, no
  # downloaded panels, so a slow mirror can never redden a code change.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,excel,parquet]"
      # fail_under lives in pyproject.toml [tool.coverage.report].
      - run: pytest -q tests/unit tests/regression --cov=paneldx --cov-report=term-missing

  # Scientific validation: the frozen environment from validation/protocol/protocol.md,
  # on the pinned public panels. Separate from `test` because it answers a
  # different question and has a different failure meaning. A checksum
  # mismatch here fails CI: the panels are pinned by sha256, and a mirror that
  # serves different bytes is a result this protocol did not agree to.
  validation-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          # Pinned by validation/protocol/protocol.json -> environment.python.
          python-version: "3.12"
      - name: Install the frozen validation environment
        run: |
          pip install -r validation/requirements.txt
          pip install --no-deps -e .
      - name: Download and verify the public panels
        run: python -m scripts.fetch_validation_data
      - name: Check the validation setup is reproducible as recorded
        run: python -m scripts.check_validation_setup
      - name: Run the validation suite
        run: pytest -q tests/validation
      # The smoke profile, not the full run: enough to prove the harness works
      # end to end on every pull request without spending four minutes on it.
      # The committed results in validation/results/ come from the development
      # profile, run deliberately when behaviour changes.
      - name: Run the corruption benchmark (smoke profile)
        run: python -m validation.harness.cases --profile smoke --out "$RUNNER_TEMP/benchmark"
      - name: Confirm the held-out split was excluded
        run: |
          python - <<'PY'
          import json, os, pathlib
          run = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "benchmark" / "run.json").read_text())
          assert run["held_out_excluded"], "the run recorded no held-out exclusions"
          for dataset in run["datasets"]:
              assert dataset not in run["held_out_excluded"], dataset
          print(f"held out, registered and not evaluated: {', '.join(run['held_out_excluded'])}")
          PY

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          # Mypy targets the project's minimum supported Python version
          # (configured in pyproject.toml), so install dependencies under that
          # same interpreter rather than parsing newer NumPy stubs as Python 3.9.
          python-version: "3.9"
      # mypy and pandas-stubs are in [dev] now, so this job is reproducible
      # locally instead of pulling whatever released most recently.
      - run: pip install -e ".[dev]"
      # Plain `mypy`: the files it checks are configured in pyproject.toml, and
      # they include scripts/ and validation/ as well as the package.
      - run: mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check distribution metadata renders on PyPI
        run: twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/clean/bin/paneldx" --help
          "$RUNNER_TEMP/clean/bin/python" -c "import paneldx; print(paneldx.__version__)"

  # pyproject.toml claims numpy>=1.21 and pandas>=1.3. The matrix above only
  # ever proves that recent releases work, so this job installs the declared
  # floors and holds them there. If it fails, the fix is to raise the lower
  # bound in pyproject.toml, not to delete this job.
  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.9"
      - run: pip install -e . pytest
      - name: Pin the declared minimum runtime dependencies
        run: pip install "numpy==1.21.*" "pandas==1.3.*"
      - name: Show what is actually installed
        run: pip list | grep -E "numpy|pandas"
      # Validation data is not fetched here: these tests are about the
      # dependency floor, and the public panels are covered by
      # `validation-data`.
      - run: pytest -q tests/unit tests/regression

  # Dependency security. audit_dependencies.py narrows the audit to the
  # closure of the runtime dependencies and the shipped extras: auditing the
  # whole environment instead reports vulnerabilities in tooling that never
  # reaches a user, and a gate that cries wolf gets bypassed.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      # Extras included: the audit covers what a user can install, and
      # pyarrow/openpyxl ship to users even though they are optional.
      - run: pip install -e ".[excel,parquet]" pip-audit
      - name: Check for conflicting dependency versions
        run: pip check
      - name: Audit shipped dependencies for known vulnerabilities
        run: python scripts/audit_dependencies.py
