[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paneldx"
dynamic = ["version"]
description = "Validate that a longitudinal dataset is what it claims to be, before you model it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "Muhammad Umer Imran" }]
keywords = [
    "panel data",
    "longitudinal",
    "data leakage",
    "data validation",
    "reproducibility",
    "entity resolution",
    "machine learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21", "pandas>=1.3"]

[project.optional-dependencies]
excel = ["openpyxl"]
# The patched PyArrow releases require Python 3.10+. PanelDX itself remains
# compatible with Python 3.9; only the optional Parquet/Feather reader does not.
parquet = ['pyarrow>=23.0.1; python_version >= "3.10"']
dev = [
    "pytest>=7.0",
    "pytest-cov",
    # Pinned to match the rev in .pre-commit-config.yaml: the formatter's output
    # changes between releases, so a floating range lets locally-formatted code
    # fail `ruff format --check` in CI.
    "ruff==0.9.4",
    # Bounded so a major release cannot change the typecheck gate underneath a
    # pull request. pandas-stubs is left open: pinning it up would drop the
    # Python 3.9 dev install, which this project still supports.
    "mypy>=1.11,<3",
    "pandas-stubs",
    "pre-commit",
    "build",
    "twine",
    "pip-audit",
]

[project.scripts]
paneldx = "paneldx.cli:main"

[project.urls]
Homepage = "https://github.com/stemmatics/paneldx"
Repository = "https://github.com/stemmatics/paneldx"
Issues = "https://github.com/stemmatics/paneldx/issues"

[tool.hatch.version]
path = "paneldx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["paneldx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B905"]  # zip(strict=) is 3.10+

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # lambda assignment is fine in test setup

[tool.mypy]
python_version = "3.9"
# The validation harness and the repository scripts are checked too: they
# produce the evidence behind the release, and a wrong annotation there is as
# expensive as one in the package.
files = ["paneldx", "scripts", "validation"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
# Next ratchet: `disallow_untyped_defs`. It currently reports 27 missing
# annotations across describe.py, keys.py, traps.py and audit.py; turn it on
# once those are annotated.

[tool.coverage.run]
branch = true
source = ["paneldx"]

[tool.coverage.report]
# Ratchet. Branch coverage measured 89% on 0.4.0; raise this as it climbs
# rather than setting a target the suite does not already meet.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
