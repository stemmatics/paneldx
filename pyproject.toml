[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paneldx"
dynamic = ["version"]
description = "Validate that a longitudinal dataset is what it claims to be, before you model it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "Muhammad Umer Imran" }]
keywords = [
    "panel data",
    "longitudinal",
    "data leakage",
    "data validation",
    "reproducibility",
    "entity resolution",
    "machine learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21", "pandas>=1.3"]

[project.optional-dependencies]
excel = ["openpyxl"]
parquet = ["pyarrow"]
dev = ["pytest>=7.0", "ruff>=0.9"]

[project.scripts]
paneldx = "paneldx.cli:main"

[project.urls]
Homepage = "https://github.com/stemmatics/paneldx"
Repository = "https://github.com/stemmatics/paneldx"
Issues = "https://github.com/stemmatics/paneldx/issues"

[tool.hatch.version]
path = "paneldx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["paneldx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B905"]  # zip(strict=) is 3.10+

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # lambda assignment is fine in test setup
